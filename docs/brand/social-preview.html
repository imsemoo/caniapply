<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CanIApply social preview (1280×640)</title>
<style>
  @font-face { font-family: "Archivo"; src: url("../../public/fonts/archivo.woff2") format("woff2"); font-weight: 400 900; font-stretch: 100% 112%; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .card { width: 1280px; height: 640px; background: #2346e8; color: #fff; font-family: "Archivo", sans-serif; padding: 64px 72px; position: relative; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  .card > img { height: 60px; }
  h1 { margin: 0; align-self: center; font-weight: 800; font-stretch: 108%; font-size: 78px; line-height: 1.02; letter-spacing: -.025em; max-width: 1000px; }
  .proof { display: flex; align-items: center; gap: 18px; font-size: 24px; }
  .proof q { background: #0d1330; padding: 12px 18px; quotes: "“" "”"; }
  .proof span { font-weight: 700; }
  .foot { position: absolute; right: 72px; top: 76px; font-size: 20px; color: #dfe5ff; }
</style>
</head>
<body>
<div class="card" id="card">
  <img src="lockup-cobalt.svg" alt="CanIApply">
  <h1>“Remote” often doesn’t include your country.</h1>
  <div class="proof"><q>You must be located in the United States.</q><span>→ excludes your country</span></div>
  <div class="foot">Free · open source · runs on your machine</div>
</div>
</body>
</html>
